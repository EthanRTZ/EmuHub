[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emuhub"
version = "0.1.0"
description = "Hub local pour organiser et lancer des jeux avec leurs emulateurs."
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
]

[project.scripts]
emuhub = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["app"]
